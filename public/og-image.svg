<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Card container -->
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="url(#cardBg)" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />

  <!-- Logo Pill Badge -->
  <rect x="110" y="100" width="340" height="42" rx="21" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
  <circle cx="132" cy="121" r="6" fill="#34d399" />
  <text x="148" y="127" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">DEUTSCHES FACHPORTAL</text>

  <!-- Main Headline -->
  <text x="110" y="220" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">nährstoffmangel.de</text>
  
  <!-- Subheadline -->
  <text x="110" y="280" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600">Symptome erkennen · Ursachen verstehen · Gezielt gegensteuern</text>

  <!-- Description paragraph -->
  <text x="110" y="335" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">Wissenschaftlich fundierte Leitfäden zu Eisen, Vitamin D, B12, Magnesium, Zink &amp; mehr.</text>
  <text x="110" y="365" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">Inklusive interaktivem Symptom-Navigator, Bluttest-Wegweiser &amp; Nährstoff-Datenbank.</text>

  <!-- Nutrient Tags -->
  <g transform="translate(110, 420)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="110" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="55" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Eisen</text>
    
    <!-- Tag 2 -->
    <rect x="125" y="0" width="130" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="190" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Vitamin D</text>

    <!-- Tag 3 -->
    <rect x="270" y="0" width="140" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="340" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Magnesium</text>

    <!-- Tag 4 -->
    <rect x="425" y="0" width="140" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="495" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Vitamin B12</text>

    <!-- Tag 5 -->
    <rect x="580" y="0" width="100" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="630" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Zink</text>

    <!-- Tag 6 -->
    <rect x="695" y="0" width="125" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="757" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Folsäure</text>

    <!-- Tag 7 -->
    <rect x="835" y="0" width="100" height="40" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="885" y="25" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Jod</text>
  </g>

  <!-- Footer Info Strip -->
  <g transform="translate(110, 505)">
    <text x="0" y="16" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="600">DGE- &amp; RKI-REFERENZEN · EVIDENZBASIERT · 100% UNABHÄNGIG</text>
  </g>
</svg>
